<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세인 고객관리</title>
<link rel="manifest" href="app.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0F2E4C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="세인 고객관리">
<style>
:root{--navy:#0F2E4C;--navy-2:#173D62;--copper:#B87333;--copper-soft:#F1E3D3;--ivory:#F5EFE6;--paper:#FFFDF9;--ink:#1B1F24;--ink-2:#5B6570;--line:#E3DCCF;--ok:#3F7D5A;--warn:#C9922E;--late:#B84A3A}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;background:var(--ivory);color:var(--ink);font-size:14px;line-height:1.5}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit;text-decoration:none}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.rail{background:var(--navy);color:#DCE4EC;padding:24px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{font-size:18px;font-weight:700;color:#fff}.brand small{display:block;font-size:11px;font-weight:400;color:#8FA3B8;margin-top:2px}
.nav{margin-top:28px;display:flex;flex-direction:column;gap:2px}
.nav button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:6px;color:#C4D0DC}
.nav button.on{background:var(--navy-2);color:#fff;box-shadow:inset 3px 0 0 var(--copper)}.nav button:hover{background:var(--navy-2)}
.rail .who{margin-top:auto;font-size:12px;color:#8FA3B8;border-top:1px solid #23496F;padding-top:14px}
.rail .who b{display:block;color:#DCE4EC;font-weight:600}.rail .who button{color:#8FA3B8;text-decoration:underline;font-size:12px;margin-top:4px}
.main{padding:28px 36px 60px;max-width:1180px;width:100%}
.top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;gap:16px;flex-wrap:wrap}
h1{font-size:24px;font-weight:700;letter-spacing:-.02em}.top p{color:var(--ink-2);margin-top:4px}
.btn{padding:9px 14px;border-radius:6px;font-weight:600;font-size:13px}.btn.primary{background:var(--copper);color:#fff}.btn.ghost{border:1px solid var(--line);background:var(--paper)}
.btn:disabled{opacity:.5;cursor:default}.btn+.btn{margin-left:8px}.btn.sm{padding:5px 10px;font-size:12px;float:right}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:8px;margin-bottom:16px}
.panel h2{font-size:14px;font-weight:700;padding:14px 18px;border-bottom:1px solid var(--line)}.panel h2 .sub{font-weight:400}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}
.stat{padding:18px;border-left:4px solid var(--copper)}.stat .n{font-size:30px;font-weight:700;line-height:1.1}.stat .l{color:var(--ink-2);margin-top:4px}
.stat.late{border-left-color:var(--late)}.stat.ok{border-left-color:var(--ok)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:600;color:var(--ink-2);font-size:12px;padding:10px 18px;border-bottom:1px solid var(--line);background:#FAF6EF}
td{padding:12px 18px;border-bottom:1px solid var(--line);vertical-align:middle}td.w{width:140px}
tr.row{cursor:pointer}tr.row:hover td{background:#FBF7F0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.name{font-weight:600}.sub{color:var(--ink-2);font-size:12px}.empty{text-align:center;padding:30px;color:var(--ink-2)}
.age{display:flex;align-items:center;gap:8px;white-space:nowrap}.age i{display:block;height:8px;border-radius:4px;background:var(--ok);min-width:6px}
.age.warn i{background:var(--warn)}.age.late i{background:var(--late)}.age span{font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;background:var(--copper-soft);color:#7A4A1C;margin-right:4px}.tag.gray{background:#ECE7DD;color:var(--ink-2)}
.own{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;background:#E2ECF5;color:var(--navy);font-weight:600}.own.me{background:var(--copper-soft);color:#7A4A1C}
.delta{font-size:12px}.delta.up{color:var(--late)}.delta.down{color:var(--ok)}
.filters{display:flex;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.filters input{flex:1;min-width:220px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;font:inherit}
.chip{padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:12px}.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.back{color:var(--ink-2);margin-bottom:10px;display:inline-block}
.head{display:grid;grid-template-columns:1fr auto;gap:24px;padding:22px;background:var(--paper);border:1px solid var(--line);border-radius:8px;margin-bottom:16px}
.head h1{font-size:26px}.head .meta{display:grid;grid-template-columns:repeat(5,auto);gap:6px 28px;margin-top:14px;font-size:13px}
.head .meta b{display:block;color:var(--ink-2);font-weight:500;font-size:12px}
.head .kpi{display:flex;gap:28px;text-align:right}.head .kpi .n{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}.head .kpi .l{font-size:12px;color:var(--ink-2)}
.readonly{margin-top:12px;display:inline-block;padding:4px 10px;border-radius:4px;background:#ECE7DD;color:var(--ink-2);font-size:12px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:16px}
.tabs button{padding:10px 16px;font-weight:600;color:var(--ink-2);margin-bottom:-2px;border-bottom:2px solid transparent}.tabs button.on{color:var(--navy);border-bottom-color:var(--copper)}
.tl{list-style:none}.tl li{display:grid;grid-template-columns:110px 20px 1fr;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.tl li.row{cursor:pointer}.tl li.row:hover{background:#FBF7F0}
.tl .d{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:13px;padding-top:2px}
.tl .dot{width:10px;height:10px;border-radius:50%;background:var(--copper);margin-top:7px;justify-self:center}.tl .dot.call,.tl .dot.video{background:var(--navy)}.tl .dot.mail{background:#9AA5B1}
.tl .t{font-weight:600}.tl .b{margin-top:4px;white-space:pre-wrap}.tl .f{margin-top:6px;font-size:12px;color:var(--ink-2)}.tl .f b{color:var(--copper)}
.people{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px}
.person{padding:14px;border:1px solid var(--line);border-radius:8px;background:#fff}.person .nm{font-weight:700;font-size:15px}.person .rl{color:var(--ink-2);font-size:12px;margin-bottom:8px}.person .ct{font-size:13px;line-height:1.7}
.bars{display:flex;align-items:flex-end;gap:10px;height:170px;padding:20px 18px 6px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bars .b i{width:100%;background:var(--navy);border-radius:3px 3px 0 0;display:block}.bars .b.cur i{background:var(--copper)}
.bars .b em{font-style:normal;font-size:11px;color:var(--ink-2)}.bars .b small{font-size:11px;font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(15,46,76,.45);display:flex;align-items:center;justify-content:center;z-index:9}
.modal{background:var(--paper);width:560px;max-width:94vw;border-radius:10px;padding:24px;max-height:94vh;overflow:auto}.modal h2{font-size:18px;margin-bottom:16px}
.fld{margin-bottom:12px}.fld label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff}.fld textarea{min-height:90px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.acts{display:flex;justify-content:flex-end;margin-top:8px}.acts.pad{padding:14px 18px}
.err{color:var(--late);font-size:12px;min-height:16px;margin-top:6px}
.drop{display:block;margin:18px;padding:36px;border:2px dashed var(--line);border-radius:8px;text-align:center;color:var(--ink-2);background:#fff;cursor:pointer}.drop b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.note{padding:14px 18px;font-size:13px;color:var(--ink-2)}.note.strong{color:var(--navy);font-weight:600}
.resolve{display:flex;gap:6px}.resolve select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff}
.login{min-height:100vh;background:var(--navy);display:flex;align-items:center;justify-content:center}
.login .card{background:var(--paper);width:420px;max-width:92vw;border-radius:12px;padding:36px 32px}
.login h1{font-size:22px;margin-bottom:4px}.login p{color:var(--ink-2);margin-bottom:22px}
.login input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:16px;background:#fff;margin-bottom:8px}
.login .btn{width:100%;padding:12px}.login .hint{margin-top:12px;font-size:12px;color:var(--ink-2);text-align:center}
@media (max-width:900px){.app{grid-template-columns:1fr}.rail{position:static;height:auto}.nav{flex-direction:row;flex-wrap:wrap;margin-top:12px}.grid3,.grid2,.people,.row2{grid-template-columns:1fr}.head{grid-template-columns:1fr}.head .meta{grid-template-columns:1fr 1fr}.head .kpi{text-align:left}.main{padding:18px}}

.gate{min-height:100vh;background:var(--navy);display:flex;align-items:center;justify-content:center}
.gate .card{background:var(--paper);width:560px;max-width:94vw;border-radius:12px;padding:32px}
.gate h1{font-size:22px;margin-bottom:4px}.gate p{color:var(--ink-2);margin-bottom:18px}
.reps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.gate .cat{margin:6px 0 8px}
.reps button{padding:16px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:700;font-size:15px}
.reps button:hover{border-color:var(--copper);background:var(--copper-soft)}
.reps button small{display:block;font-weight:400;font-size:11px;color:var(--ink-2);margin-top:3px}
.adminrow{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:16px;flex-wrap:wrap}
.adminrow>.sub,.adminrow .btn{white-space:nowrap;flex:0 0 auto}
.adminrow input{flex:1 1 140px;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:16px}
.gate .card{padding:28px 20px}
.adminrow .err{flex-basis:100%;margin:0}
.hidden{display:none!important}.view{display:none}.view.on{display:block}
.sec{margin-bottom:16px}.sec h2 .sub{font-weight:400}
.bid{display:grid;grid-template-columns:90px 1fr;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);font-size:13px}
.bid .d{color:var(--ink-2);font-variant-numeric:tabular-nums}.bid a{color:var(--navy);text-decoration:underline}
.bid .by{color:var(--ink-2);font-size:12px}
.mtab{overflow-x:auto}.mtab table{min-width:900px}.mtab th,.mtab td{padding:8px 10px;white-space:nowrap}
.mtab td.num{font-size:12.5px}.mtab .p{color:var(--ink-2);font-size:11.5px}
.mtab tr.tot td{font-weight:700;background:#FAF6EF}
.dual{display:flex;align-items:flex-end;gap:6px;height:130px;padding:14px 18px 4px;position:relative}
.dual .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.dual .b i{width:100%;background:#C9D3DD;border-radius:3px 3px 0 0;display:block}.dual .b.cur i{background:var(--navy)}
.dual .b em{font-style:normal;font-size:10.5px;color:var(--ink-2)}.dual .b small{font-size:10.5px;font-variant-numeric:tabular-nums}
.dual svg{position:absolute;left:18px;right:18px;top:14px;height:96px;width:calc(100% - 36px);pointer-events:none;overflow:visible}
.legend{padding:4px 18px 12px;font-size:11.5px;color:var(--ink-2)}.legend i{display:inline-block;width:12px;height:8px;background:#C9D3DD;border-radius:2px;margin-right:4px;vertical-align:middle}.legend b{display:inline-block;width:12px;height:2px;background:var(--copper);margin:0 4px 3px 12px;vertical-align:middle}
.cat{margin:20px 0 8px;font-size:15px;font-weight:700;color:var(--navy);border-left:4px solid var(--copper);padding-left:10px}
.items{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.item{background:var(--paper);border:1px solid var(--line);border-radius:8px}
.item h3{font-size:14px;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.item h3 .sub{font-weight:400}
.item table{font-size:12px}.item th,.item td{padding:6px 10px}
.kpi3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.ins{padding:14px 18px;font-size:13px;line-height:1.7}.ins li{margin-left:16px}
.stack{display:flex;align-items:flex-end;gap:8px;height:190px;padding:20px 18px 6px}
.stack .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.stack .b .s{width:100%;display:flex;flex-direction:column;justify-content:flex-end}
.stack .b i{width:100%;display:block}.stack .b i.bio{background:var(--navy);border-radius:3px 3px 0 0}.stack .b i.bs{background:var(--copper)}
.stack .b em{font-style:normal;font-size:11px;color:var(--ink-2);margin-top:4px}.stack .b small{font-size:11px;font-weight:600;margin-bottom:4px;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:#ECE7DD;color:var(--ink-2);margin-left:6px}
.rail .who select{width:100%;margin-top:6px;padding:6px 8px;border-radius:6px;border:0;font:inherit;background:var(--navy-2);color:#fff}
.rail .who button{color:#8FA3B8;text-decoration:underline;font-size:12px;margin-top:6px}
.tl .b{white-space:pre-wrap}

/* 좌측 레일 리파인 */
.rail{background:linear-gradient(180deg,#0F2E4C 0%,#0B2339 100%);padding:26px 14px 18px;border-right:1px solid rgba(255,255,255,.06)}
.brand{font-size:16px;font-weight:600;letter-spacing:.01em;color:#fff;padding:0 8px 18px;border-bottom:1px solid rgba(255,255,255,.09);position:relative}
.brand::after{content:"";position:absolute;left:8px;bottom:-1px;width:26px;height:2px;background:var(--copper);border-radius:2px}
.brand small{display:block;font-size:10.5px;font-weight:400;color:#7E93A8;margin-top:5px;letter-spacing:.01em}
.nav{margin-top:18px;gap:1px}
.nav button{padding:11px 12px;border-radius:8px;color:#AFC0D0;font-size:13.5px;font-weight:500;box-shadow:none;transition:background .12s,color .12s}
.nav button:hover{background:rgba(255,255,255,.05);color:#E6EDF4}
.nav button.on{background:rgba(255,255,255,.09);color:#fff;font-weight:600;box-shadow:inset 2px 0 0 var(--copper)}
.rail .who{font-size:11.5px;color:#7E93A8;border-top:1px solid rgba(255,255,255,.09);padding:14px 8px 0;line-height:1.6}
.rail .who b{color:#fff;font-weight:600;font-size:13px;letter-spacing:.01em}
.rail .who select{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#E6EDF4;font-size:12px;padding:7px 9px;border-radius:7px}
.rail .who button{color:#7E93A8;text-decoration:none;font-size:11.5px;margin-top:8px;padding:0;border-bottom:1px solid rgba(255,255,255,.2)}
.rail .who button:hover{color:#E6EDF4}
.rail .who #asof{display:block;margin-top:5px;color:#6B8099}
th{white-space:nowrap}
#v-mine td{border-bottom:0;padding-top:5px;padding-bottom:5px;font-size:13px}
#v-mine tr.grp td{border-top:1px solid var(--line);padding-top:11px}
#v-mine tr.grp:first-child td{border-top:0}
#v-mine tr.last td{padding-bottom:11px}
#v-mine td.it{white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
#v-mine td.cust{white-space:nowrap;max-width:230px;overflow:hidden;text-overflow:ellipsis}
#v-mine td.cust .name{font-size:13px;font-weight:700}
#v-mine td.br,#v-mine th.br{border-right:1px solid var(--line);background:#FAF7F1}
#v-mine td.br{font-weight:700}
#v-mine th{vertical-align:bottom;line-height:1.35}
#v-mine td.num,#v-mine th.num{white-space:nowrap}
.pc{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.pc h3{font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}.badge.up{background:#F6DEDA;color:#8F2E22}.badge.dn{background:#DCE8F3;color:#1F4E79}.badge.flat{background:#ECE7DD;color:var(--ink-2)}
.pc .line{font-size:12px;color:var(--ink-2);margin:4px 0 8px}
.pc svg{width:100%;height:150px;display:block}
.dual,.bars{position:relative}.dual .b,.bars .b{cursor:crosshair}.dual .b:hover,.bars .b:hover{background:rgba(15,46,76,.05);border-radius:4px}.tip2{position:absolute;top:-4px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:12px;padding:5px 10px;border-radius:6px;white-space:nowrap;pointer-events:none;display:none;z-index:2}
.pc .chart{position:relative}.pc .tip{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:12px;padding:5px 10px;border-radius:6px;white-space:nowrap;pointer-events:none;display:none;z-index:2}.pc .hit{fill:transparent;cursor:crosshair}.pc .hit:hover{fill:rgba(15,46,76,.06)}
.pc .ax{font-size:10px;fill:#8a9099}
.ptab{margin-top:14px}.ptab summary{cursor:pointer;font-size:13px;color:var(--navy);font-weight:600;padding:8px 0}
.ptab table{font-size:12px}.ptab th,.ptab td{padding:6px 10px}
.minor{font-size:12px;color:var(--ink-2);padding:8px 2px}
.issue td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:900px){.items{grid-template-columns:1fr}.reps{grid-template-columns:repeat(2,1fr)}}
</style>

      <div class="panel sec"><h2>영업사원별 월별 매출 <span class="sub">· 억원</span></h2><div class="mtab" id="sales-rep"></div></div><div class="panel sec"><h2>영업사원별 월별 매출 그래프 <span class="sub">· 억원</span></h2><div class="filters" style="border:0"><span id="rep-chips"></span></div><div id="sales-rep-chart"></div></div>
      <div class="panel sec"><h2>회사별 월별 매출 <span class="sub">· 억원</span></h2><div class="mtab" id="sales-comp"></div></div>
    </section>
  </main>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const REPS=DATA.reps, ADMIN_PW=DATA.admin_pw;
const TODAY=new Date(DATA.asof); const ASOF=DATA.asof.replace(/-/g,'.');
const toDate=s=>{const m=String(s).match(/(\d{4})-(\d{2})-(\d{2})/);return m?new Date(+m[1],+m[2]-1,+m[3]):null;};
const ym=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
const days=d=>d?Math.round((TODAY-d)/86400000):null;
const fmtDate=d=>d?`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`:'-';
const fmtN=n=>Math.round(Number(n||0)).toLocaleString('ko-KR');
const fmtM=n=>(Number(n||0)/1e6).toLocaleString('ko-KR',{maximumFractionDigits:1});
const fmtE=n=>(Number(n||0)/1e8).toLocaleString('ko-KR',{minimumFractionDigits:1,maximumFractionDigits:1});
const fmtP=n=>n==null?'-':Number(n).toLocaleString('ko-KR',{maximumFractionDigits:n<100?2:0});
const pct=(c,p)=>{ if(!p) return c?'신규':'-'; const x=Math.round((c-p)/p*100); return (x>0?'+':'')+x+'%'; };
const ageHtml=n=>n==null?'<span class="sub">-</span>':`<div class="age ${n>60?'late':n>30?'warn':''}"><i style="width:${Math.min(n,120)}px"></i><span>${n}일 전</span></div>`;

// ===== 데이터 준비 =====
const normName=i=>/식물성\s?보호지방|MEGA-FAT|메가팻|메가퍁/.test(i)?'메가팻':/팔미트산|하이팻/.test(i)?'하이팻':i;
const TX=DATA.tx.map(t=>({...t,i:normName(t.i),d:toDate(t.d)})).filter(t=>t.d&&!/보관료|임대료|작업비|운반비/.test(t.i));
const MONTHS=[...new Set(TX.map(t=>ym(t.d)))].sort();
const CLOSED=MONTHS.filter(m=>m<ym(TODAY)); // 마감되지 않은 당월 제외
const LASTM=CLOSED[CLOSED.length-1], PREVM=CLOSED[CLOSED.length-2];
const BIDS=DATA.bids.map(b=>({...b,dd:toDate(b.d)}));
const m3=new Date(TODAY); m3.setMonth(m3.getMonth()-3); const m6=new Date(TODAY); m6.setMonth(m6.getMonth()-6);

// 거래처 통합: 지사·지점 통합, 씨제이=디허스코리아
function groupKey(t){ const n=t.n;
  if(/농협사료/.test(n)&&/지사/.test(n)) return ['G_농협사료','(주)농협사료'];
  if(/디에스피드/.test(n)) return ['G_디에스피드','디에스피드'];
  if(/체리부로/.test(n)) return ['G_체리부로','(주)체리부로'];
  if(/디허스코리아|씨제이피드앤케어|CJ/.test(n)) return ['G_디허스코리아','디허스코리아(주)'];
  return [t.k,n]; }
const NUTRI=/나노비타믹스|나노비타쎄|나노비타블럭|하우린|Haurin|장프로|닥터N|닥터엔|Doctor N|이지스타터|초유아이지|설사72|세인파인애플/;
const BU=t=>NUTRI.test(t.i)?'뉴트리신':'사료BU';
const byKey={}, GNAME={}; for(const t of TX){ const [k,n]=groupKey(t); t.bu=BU(t); t.gk=t.bu+'|'+k; (byKey[t.gk]=byKey[t.gk]||[]).push(t); GNAME[t.gk]=n; }
const SUP=Object.entries(byKey).map(([k,tx])=>{ const bu=tx[0].bu;
  const agg={}; for(const t of tx.filter(t=>REPS.includes(t.r))) agg[t.r]=(agg[t.r]||0)+(t.d>=m3?t.a*3:t.a)+1;
  let own=Object.entries(agg).sort((a,b)=>b[1]-a[1])[0]?.[0];
  for(const [nm,rp] of Object.entries(DATA.owner_override||{})) if(GNAME[k].includes(nm)||tx.some(x=>x.n.includes(nm))) own=rp;
  if(!own) return null;
  const comps=[...new Set(tx.map(t=>t.co))].join('+');
  const items={}; for(const t of tx) items[t.i]=(items[t.i]||0)+t.a;
  const st={}; for(const t of tx){ const o=(st[t.i]=st[t.i]||{q:0,last:null,ld:null}); if(CLOSED.includes(ym(t.d))) o.q+=t.q; if(t.p>0&&(!o.ld||t.d>o.ld)){o.last=t.p;o.ld=t.d;} }
  const sites=[...new Set(tx.map(t=>t.n))]; const bizs=[...new Set(tx.map(t=>t.c).filter(Boolean))];
  const s={k,bu,name:GNAME[k],own,comp:comps,ceo:[...new Set(tx.map(t=>t.ceo).filter(Boolean))].join(', '),addr:tx.find(t=>t.ad)?.ad||'',sites,bizs,first:tx.reduce((a,t)=>t.d<a?t.d:a,tx[0].d),tx:tx.sort((a,b)=>b.d-a.d),
    ytd:tx.reduce((a,t)=>a+t.a,0),q3:tx.filter(t=>t.d>=m3).reduce((a,t)=>a+t.a,0),qp:tx.filter(t=>t.d>=m6&&t.d<m3).reduce((a,t)=>a+t.a,0),
    items:Object.entries(items).sort((a,b)=>b[1]-a[1]).map(x=>x[0]),
    istat:Object.entries(items).sort((a,b)=>b[1]-a[1]).map(([i])=>({i,last:st[i].last,mq:st[i].q/CLOSED.length})),
    mavg:tx.filter(t=>CLOSED.includes(ym(t.d))).reduce((a,t)=>a+t.a,0)/CLOSED.length};
  s.last=s.tx[0].d; s.age=days(s.last);
  s.bids=BIDS.filter(b=>s.sites.some(n=>matchBid(b.t,n))||matchBid(b.t,s.name)); return s;
}).filter(Boolean);
function matchBid(text,name){ for(const [kw,subs] of Object.entries(DATA.bidkw)){ if(text.includes(kw)&&subs.some(x=>name.includes(x))) return true; } return false; }

// ===== 게이트 =====
let ME=null, ADMIN=false, curRep='', curBU='사료BU', comp='', cur=null;
$('reps').innerHTML=REPS.map(r=>{const f=SUP.filter(s=>s.own===r&&s.bu==='사료BU').length,n=SUP.filter(s=>s.own===r&&s.bu==='뉴트리신').length;return `<button onclick="enter('${r}','사료BU')">${r}<small>사료BU ${f} · 뉴트리신 ${n}</small></button>`;}).join('');
function adminLogin(){ if($('pw').value!==ADMIN_PW){ $('pw-err').textContent='비밀번호가 맞지 않습니다'; return; } ADMIN=true; enter('','사료BU'); }
function enter(rep,bu){ curBU=bu; ME=rep;
  $('gate').classList.add('hidden'); $('app').classList.remove('hidden');
  $('brand-sub').textContent=`ERP 매출 ${ASOF} 기준`;
  $('nav-sales').style.display=ADMIN?'':'none';
  if(ADMIN){ $('who-name').textContent='관리자'; $('who-sub').textContent='전체 조회'; $('rep-sel').classList.remove('hidden'); fillRepSel(); }
  else { curRep=rep; $('who-name').textContent=rep; $('who-sub').textContent='영업담당'; }
  applyBU(); go(ADMIN?'sales':'mine');
}
function fillRepSel(){ $('rep-sel').innerHTML=REPS.map(r=>`<option>${r}</option>`).join(''); curRep=REPS[0]; }
function setRep(r){ curRep=r; go(curBU==='사료BU'?'mine':'mine2'); }
function applyBU(){ const cnt=b=>SUP.filter(s=>s.own===curRep&&s.bu===b).length; $('nav-feed').textContent=`사료BU 거래처 (${cnt('사료BU')})`; $('nav-nut').textContent=`뉴트리신 거래처 (${cnt('뉴트리신')})`; $('brand-sub').textContent=`ERP 매출 ${ASOF} 기준`; }
function go(v){ if(v==='mine'){curBU='사료BU';} if(v==='mine2'){curBU='뉴트리신'; v='mine';} const nav=v==='mine'?(curBU==='사료BU'?'mine':'mine2'):v; document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v)); document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.view===nav)); window.scrollTo(0,0); ({mine:renderMine,price:renderPrice,sales:renderSales})[v]?.(); }
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.view));

// ===== 담당 거래처 =====
function setComp(c){ comp=c; renderMine(); }
function renderMine(){
  applyBU();
  const q=$('q').value.toLowerCase();
  const mine=SUP.filter(s=>s.own===curRep&&s.bu===curBU);
  $('mine-title').textContent=`${curRep} 담당 거래처 · ${curBU}`;
  $('mine-sub').textContent=`${mine.length}개 · 월평균 매출 합계 ${fmtM(mine.reduce((a,s)=>a+s.mavg,0))}백만원`;
  $('mine-note').textContent=`월평균 = ${CLOSED[0].slice(0,4)}년 ${+CLOSED[0].slice(5)}~${+LASTM.slice(5)}월 마감 ${CLOSED.length}개월 기준 (${+ym(TODAY).slice(5)}월 제외) · 최근 단가 = 유상 거래 중 가장 최근 단가 · 입찰은 슬랙 #0-06입찰공고 및 입찰 트래커에서 거래처명 매칭`;
  const rows=mine.filter(s=>!q||(s.name+' '+s.items.join(' ')).toLowerCase().includes(q)).sort((a,b)=>b.mavg-a.mavg);
  $('mine-body').innerHTML=rows.map(s=>{ const it=s.istat.length?s.istat:[{i:'–',last:null,mq:0}]; const n=it.length; return it.map((x,j)=>`<tr class="row ${j===0?'grp':''} ${j===n-1?'last':''}" onclick="openDetail('${esc(s.k)}')"><td class="cust" title="${esc(s.name)}">${j===0?`<span class="name">${esc(s.name)}</span>`:''}</td><td class="num br">${j===0?fmtM(s.mavg):''}</td><td class="it" title="${esc(x.i)}">${esc(x.i)}</td><td class="num">${x.last!=null?fmtP(x.last):'–'}</td><td class="num">${x.mq?fmtN(x.mq):'–'}</td></tr>`).join(''); }).join('')||'<tr><td colspan="5" class="empty">해당하는 거래처가 없습니다</td></tr>';
}
function openDetail(k){ cur=SUP.find(s=>s.k===k); dtab='trade'; go('detail'); renderDetail(); }
function monthTable(rowsSpec){ // rowsSpec: [{label, sub, cells:{ym:{q,p,a}}, tot}]
  return `<table><thead><tr><th>품목</th>${MONTHS.map(m=>`<th class="num">${m.slice(2,4)}.${m.slice(5)}${m>=ym(TODAY)?'<span class="pill">진행</span>':''}</th>`).join('')}<th class="num">올해 누계 수량</th><th class="num">올해 누계 매출</th></tr></thead><tbody>${rowsSpec.map(r=>`<tr class="${r.tot?'tot':''}"><td class="name">${esc(r.label)}${r.sub?`<div class="sub">${esc(r.sub)}</div>`:''}</td>${MONTHS.map(m=>{const c=r.cells[m];return `<td class="num">${c?fmtN(c.q)+(c.p!=null?`<div class="p">${fmtP(c.p)}</div>`:'<div class="p">-</div>'):'<span class="sub">·</span>'}</td>`;}).join('')}<td class="num">${fmtN(r.ytdQ)}</td><td class="num">${fmtM(r.ytdA)}</td></tr>`).join('')}</tbody></table>`;
}
function itemRows(tx){ // 품목별 월 셀: 수량 합, 평균단가(유상 행 가중)
  const g={}; for(const t of tx){ const r=(g[t.i]=g[t.i]||{label:t.i,cells:{},ytdQ:0,ytdA:0}); const c=(r.cells[ym(t.d)]=r.cells[ym(t.d)]||{q:0,a:0,pq:0}); c.q+=t.q; c.a+=t.a; if(t.p!=null&&t.p>0){c.pq+=t.q;} r.ytdQ+=t.q; r.ytdA+=t.a; }
  for(const r of Object.values(g)) for(const c of Object.values(r.cells)) c.p=c.pq>0?c.a/c.pq:null;
  return Object.values(g).sort((a,b)=>b.ytdA-a.ytdA);
}
function bars(series,cls){ const mx=Math.max(...series.map(x=>x[1]),1); return `<div class="bars"><div class="tip2"></div>${series.map(([m,v],i)=>`<div class="b ${i===series.length-1?'cur':''}" data-tip="${+m.slice(5)}월 매출 ${fmtM(v)}백만원"><small>${fmtM(v)}</small><i style="height:${Math.max(v/mx*100,2)}%"></i><em>${m.slice(5)}월</em></div>`).join('')}</div>`; }
let dtab='trade';
let bindTipsLater=false;
document.querySelectorAll('#d-tabs button').forEach(b=>b.onclick=()=>{dtab=b.dataset.tab;renderDetail();});
function itemCard(r){ // r: itemRows() 행 → 월별 수량 막대 + 단가 선 + 표
  const ser=MONTHS.map(m=>[m,r.cells[m]?r.cells[m].q:0,r.cells[m]?r.cells[m].p:null,r.cells[m]?r.cells[m].a:0]);
  const mx=Math.max(...ser.map(x=>x[1]),1); const ps=ser.filter(x=>x[2]!=null).map(x=>x[2]); const pmin=Math.min(...ps),pmax=Math.max(...ps);
  const pts=ser.map((x,i)=>x[2]==null?null:[(i+0.5)/ser.length*100,pmax===pmin?50:100-((x[2]-pmin)/(pmax-pmin))*100]).filter(Boolean);
  const first=ps[0],last=ps[ps.length-1]; const ch=first&&last?(last-first)/first*100:null;
  return `<div class="item"><h3>${esc(r.label)}<span class="sub">올해 누계 ${fmtN(r.ytdQ)} · ${fmtM(r.ytdA)}백만원 ${ch!=null&&ps.length>1?`<span class="delta ${ch>0?'up':ch<0?'down':''}">단가 ${ch>0?'+':''}${ch.toFixed(0)}%</span>`:''}</span></h3>
    <div class="dual"><div class="tip2"></div>${ser.map(([m,q,p,a],i)=>`<div class="b ${i===ser.length-1?'cur':''}" data-tip="${+m.slice(5)}월 · 수량 ${q?fmtN(q):'–'} · 단가 ${p!=null?fmtP(p)+'원':'–'} · 매출 ${a?fmtM(a)+'백만원':'–'}"><i style="height:${Math.max(q/mx*100,1)}%"></i><em>${+m.slice(5)}월</em></div>`).join('')}
    <svg viewBox="0 0 100 100" preserveAspectRatio="none">${pts.length>1?`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#B87333" stroke-width="2.5" vector-effect="non-scaling-stroke"/>`:''}${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="1.6" fill="#B87333"/>`).join('')}</svg></div>
    <div class="legend"><i></i>거래량 <b></b>평균단가</div>
    <table><thead><tr><th></th>${ser.map(x=>`<th class="num">${+x[0].slice(5)}월</th>`).join('')}</tr></thead><tbody><tr><td class="sub">거래량</td>${ser.map(x=>`<td class="num">${x[1]?fmtN(x[1]):'·'}</td>`).join('')}</tr><tr><td class="sub">단가</td>${ser.map(x=>`<td class="num">${x[2]!=null?fmtP(x[2]):'·'}</td>`).join('')}</tr><tr><td class="sub">매출</td>${ser.map(x=>`<td class="num">${x[3]?fmtM(x[3]):'·'}</td>`).join('')}</tr></tbody></table></div>`;
}
function bindTips(root){ root.querySelectorAll('[data-tip]').forEach(el=>{ const box=el.closest('.dual,.bars,.chart'); const tip=box&&box.querySelector('.tip2,.tip'); if(!tip) return; const show=()=>{tip.textContent=el.dataset.tip;tip.style.display='block';}; el.addEventListener('mouseenter',show); el.addEventListener('touchstart',show,{passive:true}); el.addEventListener('mouseleave',()=>tip.style.display='none'); }); }
function renderDetail(){
  const s=cur; document.querySelectorAll('#d-tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===dtab));
  $('d-head').innerHTML=`<div><h1>${esc(s.name)}</h1><div class="meta"><div><b>담당자</b><span class="own me">${esc(s.own)}</span></div><div><b>부문</b>${s.bu}</div><div><b>거래 품목</b>${s.items.length}개</div><div><b>사업장</b>${s.sites.length}곳</div><div><b>입찰</b>${s.bids.length}건</div></div></div><div class="kpi"><div><div class="n">${s.age}일</div><div class="l">마지막 거래</div></div><div><div class="n">${fmtM(s.q3)}</div><div class="l">최근 3개월</div></div><div><div class="n">${fmtM(s.ytd)}</div><div class="l">올해 누계 매출(백만원)</div></div></div>`;
  const b=$('d-body');
  if(dtab==='bid'){
    b.innerHTML=`<div class="panel sec"><h2>입찰 공고 <span class="sub">· 슬랙 #0-06입찰공고 + 입찰 트래커, 거래처명 매칭 ${s.bids.length}건</span></h2>${s.bids.length?s.bids.map(x=>`<div class="bid"><div class="d">${x.d.replace(/-/g,'.')}</div><div>${x.url?`<a href="${esc(x.url)}" target="_blank">${esc(x.t)}</a>`:esc(x.t)}<div class="by">${x.src==='slack'?'슬랙 · '+esc(x.by):'입찰 트래커 자동수집'}</div></div></div>`).join(''):'<div class="empty">매칭된 입찰 공고가 없습니다</div>'}</div>
    <div class="panel sec"><h2>계약 조건 <span class="sub">· ERP 적요에서 단가·기간이 언급된 메모</span></h2>${(()=>{const c=s.tx.filter(t=>t.m&&/원|월|분기|계약|입찰|낙찰|고정|동가|인상|인하/.test(t.m)); const seen=new Set(); const rows=[]; for(const t of c){ if(seen.has(t.m)) continue; seen.add(t.m); rows.push(t); if(rows.length>=15) break; } return rows.length?`<table><thead><tr><th>일자</th><th>품목</th><th class="num">단가</th><th>메모</th></tr></thead><tbody>${rows.map(t=>`<tr><td>${fmtDate(t.d)}</td><td>${esc(t.i)}</td><td class="num">${fmtP(t.p)}</td><td>${esc(t.m)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">계약 조건 관련 메모가 없습니다. 계약 정리 시트가 있으면 연결할 수 있습니다.</div>';})()}</div>`;
  }
  if(dtab==='trade'){
    const rows=itemRows(s.tx); const ms={}; for(const t of s.tx) ms[ym(t.d)]=(ms[ym(t.d)]||0)+t.a;
    const recent=s.tx.slice(0,5);
    b.innerHTML=`    <div class="panel sec"><h2>월별 매출 (백만원)</h2>${bars(MONTHS.map(m=>[m,ms[m]||0]))}</div>
    <div class="panel sec"><h2>품목별 월별 수량·평균단가·매출 <span class="sub">· 위 줄 수량 / 아래 줄 평균단가(원) · 무상(1+1)은 수량에만 포함</span></h2><div class="mtab">${monthTable(rows)}</div></div>
    <div class="cat">품목별 그래프</div><div class="items">${rows.map(itemCard).join('')}</div>
    <div class="cat">최근 거래</div><div class="panel sec"><h2>최근 거래 5건</h2><table><thead><tr><th>일자</th><th>품목</th><th class="num">수량</th><th class="num">단가(원)</th><th class="num">금액(원)</th><th>적요</th></tr></thead><tbody>${recent.map(t=>`<tr><td>${fmtDate(t.d)}</td><td class="name">${esc(t.i)}</td><td class="num">${fmtN(t.q)}</td><td class="num">${t.p!=null?fmtP(t.p):'<span class="sub">무상</span>'}</td><td class="num">${fmtN(t.a)}</td><td class="sub">${esc(t.m)}</td></tr>`).join('')}</tbody></table></div>`;

  const tbl=(obj,order)=>`<table><thead><tr><th></th>${MONTHS.map(m=>`<th class="num">${+m.slice(5)}월</th>`).join('')}<th class="num">올해 누계</th></tr></thead><tbody>${order.map(k=>{const r=obj[k]||{};return `<tr><td class="name">${esc(k)}</td>${MONTHS.map(m=>`<td class="num">${r[m]?fmtE(r[m]):'·'}</td>`).join('')}<td class="num">${fmtE(sum(r))}</td></tr>`;}).join('')}<tr class="tot"><td>합계</td>${MONTHS.map(m=>`<td class="num">${fmtE(order.reduce((a,k)=>a+((obj[k]||{})[m]||0),0))}</td>`).join('')}<td class="num">${fmtE(order.reduce((a,k)=>a+sum(obj[k]),0))}</td></tr></tbody></table>`;
  const order=[...REPS].sort((a,b)=>sum(rep[b])-sum(rep[a]));
  $('sales-rep').innerHTML=tbl(rep,order);
  if(!chipRep) chipRep=order[0];
  $('rep-chips').innerHTML=order.map(r=>`<button class="chip ${r===chipRep?'on':''}" onclick="chipRep='${r}';renderSales()">${r}</button>`).join('');
  const rr=rep[chipRep]||{}; const rt=MONTHS.map(m=>rr[m]||0); const rmx=Math.max(...rt,1);
  $('sales-rep-chart').innerHTML=`<div class="bars">${MONTHS.map((m,i)=>`<div class="b ${m===LASTM?'cur':''}"><small>${fmtE(rt[i])}</small><i style="height:${Math.max(rt[i]/rmx*100,2)}%"></i><em>${+m.slice(5)}월${m>=ym(TODAY)?'*':''}</em></div>`).join('')}</div><div class="note">${chipRep} · 올해 누계 ${fmtE(sum(rr))}억원 · * 진행 중인 월</div>`;
  $('sales-comp').innerHTML=tbl({'세인바이오':bio,'세인비에스':bs},['세인바이오','세인비에스']);
}
</script>
